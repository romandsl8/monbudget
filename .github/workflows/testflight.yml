# =====================================================================
#  MonBudget → TestFlight (GitHub Actions)
#  Génère le projet (XcodeGen) et l'icône, lance les tests, puis — si les
#  clés Apple sont configurées — signe, incrémente le numéro de build et
#  envoie sur TestFlight.
#
#  Machine : image « xcode-27 » (Xcode 27.2 = SDK iOS 27, nécessaire pour
#  l'iPhone Duo).
#
#  Secrets (Settings > Secrets and variables > Actions > Secrets) :
#    APP_STORE_CONNECT_ISSUER_ID       Issuer ID de la clé API App Store Connect
#    APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID de la clé API
#    APP_STORE_CONNECT_PRIVATE_KEY     contenu complet du fichier AuthKey_XXXX.p8
#    CERTIFICATE_PRIVATE_KEY           clé privée RSA du certificat de distribution
#  Variable (onglet Variables) :
#    APP_STORE_APPLE_ID                identifiant Apple (10 chiffres) de la fiche App Store Connect
#
#  Sans ces réglages, le workflow compile et teste seulement (pas d'envoi).
# =====================================================================

name: MonBudget → TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: testflight
  cancel-in-progress: true

env:
  APP_BUNDLE_ID: fr.tanguy.monbudget
  APP_NAME: Mon Budget
  XCODE_VERSION: "27.2"
  XCODE_PROJECT: MonBudget.xcodeproj
  XCODE_SCHEME: MonBudget

jobs:
  testflight:
    # Image Xcode 27 de GitHub (Mac arm64). En cas de pénurie de machines Mac chez GitHub,
    # le job peut rester en file puis être annulé : il suffit de le relancer.
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      APP_STORE_APPLE_ID: ${{ vars.APP_STORE_APPLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les réglages Apple
        id: cfg
        run: |
          missing=""
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Secrets manquants :$missing → compilation et tests seulement, pas d'envoi TestFlight."
            echo "keys=false" >> "$GITHUB_OUTPUT"
          else
            echo "keys=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$APP_STORE_APPLE_ID" ]; then
            echo "::warning::Variable APP_STORE_APPLE_ID absente (fiche App Store Connect pas encore créée) → pas d'envoi TestFlight."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Choisir Xcode 27 (SDK iOS 27, nécessaire pour l'iPhone Duo)
        run: |
          echo "Xcode installés :"; ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          else
            # Sinon, le Xcode 27.x le plus récent présent sur la machine.
            XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            echo "::error::Aucun Xcode 27 sur cette machine : impossible de compiler avec le SDK iOS 27."
            exit 1
          fi
          echo "→ $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Installer XcodeGen et les outils de signature
        run: |
          brew install xcodegen
          pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Générer l'icône et le projet Xcode
        run: |
          python3 scripts/make_icon.py
          xcodegen generate

      - name: Tests unitaires (le build échoue si un test échoue)
        run: |
          mkdir -p build
          # Simulateurs iPhone candidats : uniquement les systèmes iOS ≥ 26 réellement installés,
          # du plus récent au plus ancien (l'image GitHub peut annoncer un runtime absent).
          xcrun simctl list runtimes -j > build/runtimes.json
          xcrun simctl list devices -j > build/devices.json
          CANDIDATES=$(python3 - <<'PY'
          import json
          runtimes = json.load(open("build/runtimes.json"))["runtimes"]
          devices = json.load(open("build/devices.json"))["devices"]
          ios = [r for r in runtimes if r.get("platform", "iOS") == "iOS" and r.get("isAvailable")
                 and int(r["version"].split(".")[0]) >= 26]
          ios.sort(key=lambda r: [int(x) for x in r["version"].split(".")], reverse=True)
          for r in ios:
              phones = [d for d in devices.get(r["identifier"], []) if d["name"].startswith("iPhone") and d.get("isAvailable", True)]
              if phones:
                  print(phones[0]["udid"], r["version"])
          PY
          )
          echo "Candidats :"; echo "$CANDIDATES"
          ok=0
          while read -r SIM_ID VERSION; do
            [ -z "$SIM_ID" ] && continue
            echo "== Tests sur le simulateur iOS $VERSION ($SIM_ID)"
            xcodebuild test \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -destination "id=$SIM_ID" \
              CODE_SIGNING_ALLOWED=NO \
              > build/xcodebuild-test.log 2>&1 || true
            if grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild-test.log; then ok=1; break; fi
            if grep -qE "runtime is not available|Unable to boot|Unable to find a destination|Failed to install" build/xcodebuild-test.log; then
              echo "Simulateur indisponible, essai du suivant…"; continue
            fi
            break   # vrai échec de compilation ou de test
          done <<< "$CANDIDATES"
          grep -E "error:|Test Case .* failed|\*\* TEST|not available" build/xcodebuild-test.log | tail -60 || true
          [ "$ok" = 1 ]

      - name: Enregistrer le bundle ID chez Apple (si besoin)
        if: steps.cfg.outputs.keys == 'true'
        run: |
          app-store-connect bundle-ids create "$APP_BUNDLE_ID" --name "$APP_NAME" --platform IOS \
            || echo "Bundle ID déjà enregistré (ou création impossible) — on continue."

      - name: Signature (profil App Store)
        if: steps.cfg.outputs.publish == 'true'
        run: |
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Numéro de build = dernier build TestFlight + 1
        if: steps.cfg.outputs.publish == 'true'
        run: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then LATEST=0; fi
          NEW=$((LATEST + 1))
          echo "Dernier build TestFlight : $LATEST → nouveau build : $NEW"
          agvtool new-version -all "$NEW"

      - name: Compiler l'IPA
        if: steps.cfg.outputs.publish == 'true'
        run: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

      - name: Envoyer sur TestFlight
        if: steps.cfg.outputs.publish == 'true'
        run: |
          app-store-connect publish --path "build/ios/ipa/*.ipa"

      - name: Restaurer le trousseau
        if: always() && steps.cfg.outputs.publish == 'true'
        run: keychain use-login || true

      - name: Conserver les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-build
          path: |
            build/xcodebuild-test.log
            /tmp/xcodebuild_logs/*.log
          if-no-files-found: ignore
